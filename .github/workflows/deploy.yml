name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [update-docs-freshness]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so mkdocs-git-revision-date-localized can get accurate per-file lastmod dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture platform SHA from dispatch (if triggered by platform commit)
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "PLATFORM_SHA=${{ github.event.client_payload.sha }}" >> $GITHUB_ENV
          echo "PLATFORM_SHA_SHORT=${{ github.event.client_payload.sha_short }}" >> $GITHUB_ENV
          echo "PLATFORM_REF=${{ github.event.client_payload.ref }}" >> $GITHUB_ENV
          echo "PLATFORM_MESSAGE=${{ github.event.client_payload.commit_message }}" >> $GITHUB_ENV
          echo "Dispatched from platform commit ${{ github.event.client_payload.sha_short }}"

      - name: Build and deploy (freshness hook will pick up PLATFORM_SHA if set)
        run: mkdocs gh-deploy --force
